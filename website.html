<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff4b5c, 0 0 20px #ff4b5c, 0 0 30px #ff4b5c;
            animation: glow 2s infinite alternate, fadeIn 2s ease-in-out;
        }

        p {
            font-size: 20px;
            opacity: 0;
            animation: fadeIn 3s ease-in-out 1s forwards;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #ff4b5c, 0 0 20px #ff4b5c;
            }
            to {
                text-shadow: 0 0 20px #ff4b5c, 0 0 30px #ff4b5c;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <h1>I'm Sorry</h1>
    <p>I never meant to hurt you. Please forgive me.</p>

</body>
</html>
